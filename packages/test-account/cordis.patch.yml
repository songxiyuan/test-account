- insert:
    # Mounts the upstream @playwright/mcp server itself, once per live Session,
    # through @deepseek-ai/dsh-mcp-client. DSH's browser-use stack only exists on
    # the 0.1.6+ line and pins the server arguments, so --caps=storage (and with
    # it browser_storage_state / browser_set_storage_state) never reaches an
    # Agent there. This provider adds exactly that switch.
    - id: test-account-playwright-mcp
      name: '@songxiyuan/playwright-mcp-storage'
      config:
        mode: launch
        # Saving a login state needs a human to log in, so the window stays visible.
        headless: false
        allowUnrestrictedFileAccess: true
        # autoExecutablePath (default true) probes the usual Chrome / Chromium /
        # Edge locations; set executablePath here to pin one, or run
        # `npx @playwright/mcp install-browser chrome-for-testing` and set
        # autoExecutablePath: false to use the Playwright-managed browser.

    - id: test-account
      name: '@songxiyuan/test-account'
      config:
        mcpProvider: playwright-mcp
        stateAccess: direct
        # account_list / account_save / account_use / account_current; false hides them.
        agentTools: true
