# Publish the two packages to the public npm registry (+ attach tarballs to the Release).
#
# Publishing needs the repo secret `NPM_TOKEN` (an npm automation / granular
# access token with read+write on the `@songxiyuan` scope). The runner's own
# GITHUB_TOKEN is only used for the Release assets (`contents: write`).
#
#   git tag v0.1.1 && git push origin v0.1.1     # tag → publish + release assets
#   Actions → publish → Run workflow            # same, against the current commit
#
# The scope is an npm-side fact: only the npm user/org owning `@songxiyuan` can
# publish these names. It is no longer tied to the repository owner.
name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The default registry stays npmjs.org, so both the build-time
      # `@deepseek-ai/*` dependencies and the published packages resolve there.
      - name: install
        run: pnpm install --frozen-lockfile

      # typecheck + build + tests + client bundle structure + pack integrity
      - name: verify
        run: pnpm run verify

      - name: publish to the public npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          {
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN"
          } >> .npmrc
          pnpm -r --filter './packages/*' publish --no-git-checks --registry https://registry.npmjs.org

      # `npm pack` runs each package's prepack, so the tarballs carry a fresh lib/.
      - name: pack release tarballs
        run: |
          mkdir -p dist
          (cd packages/test-account && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          (cd packages/playwright-mcp-storage && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")

      # Tag runs get a Release whose assets install with no registry auth at all.
      - name: attach tarballs to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes "DSH 测试账号插件 ${GITHUB_REF_NAME}：公共 npm 上的镜像 tarball。" \
          || gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber

      - name: keep the tarballs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: dist/*.tgz
